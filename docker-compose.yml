services:
  spoor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPOOR_BIND=0.0.0.0
      - SPOOR_PORT=8080
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - spoor-cache:/var/lib/spoor
    restart: unless-stopped

volumes:
  spoor-cache:
