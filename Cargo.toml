[workspace]
resolver = "2"
members = [
    "crates/spoor-core",
    "crates/spoor-providers",
    "crates/spoor-export",
    "crates/spoor-server",
    "crates/spoor-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Voldigoade"]
repository = "https://github.com/Voldigoade/spoor"
description = "Terminal-first GitHub public-footprint inspection and research tool"

[workspace.dependencies]
spoor-core = { path = "crates/spoor-core" }
spoor-providers = { path = "crates/spoor-providers" }
spoor-export = { path = "crates/spoor-export" }
spoor-server = { path = "crates/spoor-server" }

tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros", "tokio"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
url = "2.5"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
regex = "1.10"
flate2 = "1.0"
ipnet = "2.12"
